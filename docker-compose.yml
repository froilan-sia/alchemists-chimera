# Docker Compose for Alchemist's Chimera
# Kiroween Hackathon 2026 - Local Hybrid RAG Engine

version: '3.8'

services:
  app:
    build: .
    # Preserve the existing local FastAPI deployment; Hugging Face uses the
    # Dockerfile's Streamlit/7860 default command instead.
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./ontology:/app/ontology
      - ./models:/app/models
      - ./src:/app/src
      - ./tests:/app/tests
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - GRAPH_STORE_PATH=/app/ontology/finance-ontology.ttl
      - VECTOR_STORE_PATH=/app/data/vector_store
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - LLM_MODEL=qwen2.5:3b
      - LLM_TEMPERATURE=0.1
      - MAX_CONCURRENT_QUERIES=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  # Optional: Add monitoring stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data: